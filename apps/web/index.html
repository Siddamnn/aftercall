<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="You keep your conversations, we handle the rest. aftercall asks every call and chat the same questions and answers them with a confidence score, built on Google Cloud, Gemini and Firebase." />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0B0E" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="aftercall: You keep your conversations, we handle the rest." />
    <meta property="og:description" content="Transcript and audio analysis for sales calls, support lines, voice agents and chat. Built on Google Cloud, Gemini and Firebase." />
    <title>aftercall: You keep your conversations, we handle the rest.</title>
    <script>
      // Apply the saved theme before first paint, so there is no flash. src/theme.ts keeps it in sync.
      try {
        var t = localStorage.getItem("theme")
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
