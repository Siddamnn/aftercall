[project]
name = "aftercall"
version = "0.1.0"
description = "Conversation analysis on Google Cloud, powered by TypeSafe Jev and Gemini"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-tasks>=2.16",
    "google-genai>=1.0",
    "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aftercall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"
